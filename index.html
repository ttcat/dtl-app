<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DTL 控制室</title>
<style>
:root{--paper:#FCFCFB;--ink:#1C1E26;--ink2:#5B6070;--ink3:#9BA0AE;--card:#FFF;--line:#E7E7E4;--rail:#F4F4F1;
--fN:#2563eb;--fDI:#d97706;--fSE:#db2777;--fH:#7c3aed;--fO:#0d9488;--fP:#64748b;
--good:#15803d;--warn:#b45309;--crit:#dc2626;--focus:#2563eb}
@media(prefers-color-scheme:dark){:root{--paper:#17181C;--ink:#E8E9ED;--ink2:#A6AAB6;--ink3:#6B7080;--card:#1F2127;--line:#2E3138;--rail:#1B1C21;--fN:#3b82f6;--fSE:#ec4899;--fH:#8b5cf6;--good:#4ade80;--warn:#fbbf24;--crit:#f87171}}
:root[data-theme=dark]{--paper:#17181C;--ink:#E8E9ED;--ink2:#A6AAB6;--ink3:#6B7080;--card:#1F2127;--line:#2E3138;--rail:#1B1C21;--fN:#3b82f6;--fSE:#ec4899;--fH:#8b5cf6;--good:#4ade80;--warn:#fbbf24;--crit:#f87171}
:root[data-theme=light]{--paper:#FCFCFB;--ink:#1C1E26;--ink2:#5B6070;--ink3:#9BA0AE;--card:#FFF;--line:#E7E7E4;--rail:#F4F4F1;--fN:#2563eb;--fSE:#db2777;--fH:#7c3aed;--good:#15803d;--warn:#b45309;--crit:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
.num{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:9;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--ink3);text-transform:uppercase}
h1{margin:0;font-size:16px;font-weight:700}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav a{padding:6px 12px;border-radius:6px;color:var(--ink2);text-decoration:none;font-size:13px}
nav a.on{background:var(--ink);color:var(--paper);font-weight:600}
.hbtn{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer}
main{padding:16px 18px;max-width:1280px;margin:0 auto}
h2{font-size:15px;margin:4px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card .l{font-size:11px;color:var(--ink2)}.card .v{font-size:20px;font-weight:700}.card .s{font-size:11px;color:var(--ink3)}
.card.prov{border-style:dashed}.card.crit .v{color:var(--crit)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card);margin-bottom:16px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{font-size:11px;color:var(--ink2);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card)}
td{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--rail)}
td.click{cursor:pointer} td.click:hover{background:var(--rail)}
.cell{display:inline-block;min-width:44px;text-align:center;border-radius:4px;padding:2px 4px;font-size:11.5px}
.u100{background:color-mix(in oklab,var(--fN) 26%,transparent)} .u60{background:color-mix(in oklab,var(--fN) 14%,transparent)}
.u0{background:color-mix(in oklab,var(--crit) 18%,transparent);color:var(--crit);font-weight:600}
.uP{outline:1.5px dashed var(--fP);outline-offset:-1.5px}
.uOver{background:color-mix(in oklab,var(--crit) 30%,transparent);color:var(--crit);font-weight:700;outline:1.5px solid var(--crit);outline-offset:-1.5px}
.fG{background:color-mix(in oklab,var(--good) 22%,transparent)}
.fY{background:color-mix(in oklab,var(--warn) 26%,transparent);color:var(--warn);font-weight:600}
.fR{background:color-mix(in oklab,var(--crit) 26%,transparent);color:var(--crit);font-weight:600}
.fN{border:2px solid var(--crit);font-weight:700;color:var(--crit)}
.uFar{outline:1.5px dashed var(--fP);outline-offset:-1.5px;opacity:.82}
.hasNote{position:relative}
.hasNote::after{content:'';position:absolute;top:1.5px;right:1.5px;width:4px;height:4px;border-radius:50%;background:var(--fN)}
th[id^=mcol_]{scroll-margin-left:150px}
.tblwrap th:first-child,.tblwrap td:first-child{position:sticky;left:0;background:var(--card);z-index:2}
tr.click:hover td:first-child{background:var(--rail)}
.introw td{border-top:2px solid var(--line);color:var(--crit);font-weight:600}
#edErr,#fdErr{display:none;color:var(--crit);font-size:12.5px;margin-top:8px}
.capEdit{cursor:pointer}.capEdit:hover{outline:1.5px solid var(--focus);outline-offset:-1.5px}
.miniact{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:5px;padding:2px 8px;font-size:11.5px;cursor:pointer;margin-right:4px}
.miniact.ok{color:var(--good);border-color:var(--good)}.miniact.no{color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.uEdit{cursor:pointer} .uEdit:hover{outline:1.5px solid var(--focus);outline-offset:-1.5px}
.pend{outline:1.5px dashed var(--warn);outline-offset:-1.5px;position:relative}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;border:1px solid var(--line)}
.pill.draft{color:var(--ink2)} .pill.pending,.pill.pending_po,.pill.evidence_pending{color:var(--warn);border-color:var(--warn)}
.pill.sent{color:var(--fN);border-color:var(--fN)} .pill.approved,.pill.applied{color:var(--good);border-color:var(--good)}
.pill.rejected{color:var(--crit);border-color:var(--crit)}
.pill.needs_review{color:var(--warn);border-color:var(--warn);border-style:dashed}
.prov-badge{font-size:10px;border:1px dashed var(--fP);color:var(--ink2);border-radius:4px;padding:0 5px;margin-left:6px}
.bar{height:14px;background:var(--rail);border-radius:4px;position:relative;overflow:hidden;min-width:140px}
.bar i{position:absolute;top:0;bottom:0;left:0;background:var(--fN);border-radius:4px 0 0 4px}
.bar i.over{background:var(--crit)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin:0 0 10px}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
select,input[type=text],input[type=number]{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px}
input:focus,select:focus,button:focus,a:focus{outline:2px solid var(--focus);outline-offset:1px}
.note{font-size:12px;color:var(--ink3);margin:8px 0 14px}
.banner{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;margin-bottom:14px;background:var(--card);color:var(--ink2)}
.banner.err{border-color:var(--crit);color:var(--crit)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--fN);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:18px;max-width:340px;width:92vw}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 10px;font-size:14px}
dialog .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0;font-size:13px}
dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer}
.btn.primary{background:var(--fN);border-color:var(--fN);color:#fff}
.mysum{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--fN);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;line-height:1.7}
#login{max-width:360px;margin:12vh auto;padding:0 16px}
#login .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px}
#login h2{margin:0 0 6px;font-size:17px}
#login p{font-size:13px;color:var(--ink2);margin:0 0 16px}
#login input[type=email],#login input[type=password]{width:100%;padding:9px 10px;font-size:14px;margin-bottom:10px}
#login .btn{width:100%;padding:9px}
#login .msg{font-size:13px;margin-top:12px;color:var(--good)}
#login .msg.err{color:var(--crit)}
@media(max-width:640px){.cell{min-width:34px;padding:2px 2px;font-size:11px}td,th{padding:4px 5px}main{padding:10px 8px}}
</style>
</head>
<body>
<header>
  <div><div class="eyebrow">DTL · Control Room · Live</div><h1 id="title">總表</h1></div>
  <span id="status" class="note" style="margin:0"></span>
  <nav id="nav">
    <a href="#master">總表</a><a href="#person">個人頁</a><a href="#projects">專案</a><a href="#lines">職務</a><a href="#scenarios">提案</a><a href="#amend">修約與閘門</a>
    <button class="hbtn" id="refresh" title="重新載入資料">↻</button>
    <button class="hbtn" id="theme" title="切換主題">◐</button>
    <select class="hbtn" id="scnSel" title="情境：正式版或你的草稿" style="display:none;max-width:170px" onchange="setScn(this.value)"></select>
    <button class="hbtn" id="scnNew" title="開新情境（複製正式版成你的沙盒）" style="display:none" onclick="frmScn()">＋情境</button>
    <select class="hbtn" id="curSel" title="顯示幣別（≈為換算值，帳務仍以原幣記）" style="display:none" onchange="setCur(this.value)"><option value="TWD">NT$</option><option value="USD">US$</option><option value="EUR">€ EUR</option></select>
    <button class="hbtn" id="maskBtn" title="隱藏/顯示金額（分享螢幕用）" style="display:none">👁 金額</button>
    <button class="hbtn" id="logout" title="登出" style="display:none">登出</button>
  </nav>
</header>
<div id="login" style="display:none"><div class="box">
  <div class="eyebrow">DTL · Control Room</div>
  <h2>登入</h2>
  <p>輸入你的工作信箱，我們會寄一封登入連結（僅限受邀成員）。</p>
  <input type="email" id="lgEmail" placeholder="you@doublethinklab.org" autocomplete="email">
  <button class="btn primary" id="lgSend">寄送登入連結</button>
  <div id="lgMsg" class="msg" style="display:none"></div>
  <div id="pwdBox" style="display:none;margin-top:18px;border-top:1px solid var(--line);padding-top:14px">
    <p>（選填）為帳號設定密碼，之後也可用密碼登入：</p>
    <input type="password" id="pwdNew" placeholder="新密碼（至少 8 碼）" autocomplete="new-password">
    <button class="btn" id="pwdSave">設定密碼</button>
    <button class="btn" id="pwdSkip">略過</button>
  </div>
</div></div>
<main id="app" style="display:none"><p class="banner"><span class="spin"></span> 從資料庫載入中…</p></main>

<dialog id="editDlg">
  <h3 id="edTitle">提案修改</h3>
  <div class="row"><span>新 LOE %</span><input type="number" id="edLoe" min="0" max="100" step="5" style="width:90px"></div>
  <div class="row"><span>換算金額</span><b class="num" id="edAmt">—</b></div>
  <div class="row"><span>提案人</span><input type="text" id="edAuthor" placeholder="你的名字" style="width:150px"></div>
  <div class="row"><span>備註</span><input type="text" id="edNote" placeholder="選填" style="width:150px"></div>
  <p class="note" style="margin:6px 0 0">送出後為「待套用」提案（虛線標示），由財務/CEO 核可後寫入正式資料。</p>
  <div id="edErr"></div>
  <div class="acts"><button class="btn" id="edCancel">取消</button><button class="btn primary" id="edSave">送出提案</button></div>
</dialog>

<dialog id="sealDlg">
  <h3>🔒 觸及已送財報期間</h3>
  <div id="sealMsg" style="color:var(--crit);font-size:13px;line-height:1.6;margin-bottom:10px"></div>
  <div class="row"><span>修改原因*</span><input type="text" id="sealReason" style="width:180px" placeholder="必填"></div>
  <div class="row"><span>輸入 YES 放行</span><input type="text" id="sealYes" style="width:180px" placeholder="YES"></div>
  <p class="note" style="margin:6px 0 0">放行後會在稽核紀錄留下：誰、何時、哪些格、原因。</p>
  <div class="acts"><button class="btn" id="sealCancel">取消</button><button class="btn primary" id="sealGo">放行修改</button></div>
</dialog>

<dialog id="formDlg">
  <h3 id="fdTitle"></h3>
  <div id="fdBody"></div>
  <div id="fdErr"></div>
  <div class="acts"><button class="btn" id="fdCancel">取消</button><button class="btn primary" id="fdSave">儲存</button></div>
</dialog>
<script>
const SB='https://wunwsxapbksqrfthseqz.supabase.co';
const KEY='sb_publishable_ekm9TwJ7pfZi3OjClaHT8Q_qyJGcPeA';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
// ---- 動態時間軸（B4）：月份範圍由所有專案期間推算，起點固定 2026-08（資料起點） ----
let M=[],ML={},FARM='999912';
const mAdd=(m,n)=>{let y=+m.slice(0,4),mo=+m.slice(4)-1+n;y+=Math.floor(mo/12);mo=((mo%12)+12)%12;return y+String(mo+1).padStart(2,'0')};
const nowMonth=()=>{const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')};
function buildTimeline(){
  let end='202706';
  (DB.projects||[]).forEach(p=>{
    const mm=String(p.period||'').match(/,(\d{4})-(\d{2})-(\d{2})[\)\]]/);
    if(!mm)return;
    let em=mm[1]+mm[2];
    if(String(p.period).trim().endsWith(')')&&mm[3]==='01')em=mAdd(em,-1); // 上界排除式
    if(em>end)end=em;
  });
  (DB.allocations||[]).forEach(a=>{if(a.month>end)end=a.month});
  M=[];let m='202608';
  while(m<=end&&M.length<120){M.push(m);m=mAdd(m,1)}
  ML={};M.forEach(x=>ML[x]=((x.slice(4)==='01'||x===M[0])?(+x.slice(0,4))+'年':'')+(+x.slice(4))+'月');
  FARM=mAdd(nowMonth(),12); // 超過未來 12 個月 ＝ 遠期規劃假設
}
const PLANB=()=>M.filter(m=>m>='202608'&&m<='202701'); // Plan B 視窗（Aug–1月）
window.jumpYear=y=>{const el=document.getElementById('mcol_'+y);if(el)el.scrollIntoView({behavior:'auto',inline:'start',block:'nearest'})};
const thead=()=>M.map(m=>`<th ${(m===M[0]||m.slice(4)==='01')?`id="mcol_${m.slice(0,4)}"`:''} ${m>FARM?'style="color:var(--ink3)"':''}>${ML[m]}</th>`).join('');
const yearJump=()=>{const ys=[...new Set(M.map(m=>m.slice(0,4)))];
  return ys.length>1?`<div style="display:flex;gap:6px;align-items:center;margin:0 0 8px"><span class="note" style="margin:0">跳至：</span>${ys.map(y=>`<button class="hbtn num" onclick="jumpYear('${y}')">${y}</button>`).join('')}</div>`:''};
const farNote=()=>M[M.length-1]>FARM?`<p class="note">⚠ 遠期提醒：${(+FARM.slice(0,4))}年${+FARM.slice(4)}月之後（超過未來 12 個月）為<b>規劃假設</b>，格子以虛線顯示；pipeline 專案另計信心度加權，非承諾數字。</p>`:'';
const SHORT={ned:'NED',di:'AIT(DI)',se:'AIT(SE)',hrf:'HRF',otf:'OTF',gr:'AIT(GR)',ned2027:'NED新期',pipeA:'新案A',pipeB:'新案B',internal:'存金'};
const PC={ned:'--fN',di:'--fDI',se:'--fSE',hrf:'--fH',otf:'--fO',ned2027:'--fP',pipeA:'--fP',pipeB:'--fP',internal:'--crit'};
let ROLE=null;
let MASK=localStorage.getItem('cr_mask')==='1';
const isAdmin=()=>!!(ROLE&&ROLE.role==='admin');
const money=s=>!isAdmin()?'':(MASK?'●●●':s);
// ---- 幣別切換（B4）：顯示換算，帳務仍以 TWD/原幣記 ----
let CUR=localStorage.getItem('cr_cur')||'TWD';
let RATES={USD:31.5,EUR:34,asof:''};
const SYM={USD:'US$',EUR:'€'};
const cvt=v=>CUR==='TWD'?+v:(+v)/(RATES[CUR]||1);
const fmtC=v=>'≈'+SYM[CUR]+Math.round(cvt(v)).toLocaleString('en');
const k=v=>money(CUR==='TWD'?(v/1000).toLocaleString('zh-TW',{maximumFractionDigits:0})+'k':fmtC(v));
const wan=v=>money(CUR==='TWD'?(v/10000).toLocaleString('zh-TW',{maximumFractionDigits:0})+'萬':fmtC(v));
const kTWD=v=>money((v/1000).toLocaleString('zh-TW',{maximumFractionDigits:0})+'k'); // 原幣欄位用：不隨 CUR 換算
const kExp=v=>MASK&&isAdmin()?'●●●':(CUR==='TWD'?(v/1000).toLocaleString('zh-TW',{maximumFractionDigits:0})+'k':fmtC(v)); // 業務費：member 可見（CEO 裁定不保密），admin 遮蔽仍有效
const origMoney=(amount,curr)=>money(curr==='TWD'?(+amount/1000).toLocaleString('zh-TW',{maximumFractionDigits:0})+'k':(SYM[curr]||curr+' ')+(+amount).toLocaleString('en',{maximumFractionDigits:0}));
const usd=v=>money('US$'+(+v).toLocaleString('en',{maximumFractionDigits:0}));
window.setCur=v=>{CUR=v;localStorage.setItem('cr_cur',v);route()};
let DB=null,pmap={},prmap={},W=[],pending={};
let VIEW=localStorage.getItem('cr_view')||'load';
window.setView=v=>{VIEW=v;localStorage.setItem('cr_view',v);route()};
// ---- B6: 情境系統 ----
let OFFICIAL='V8.1',ACTIVE='V8.1',SCNS=[],ROLEMAP={},SNOTES={};
const myDrafts=()=>SCNS.filter(s=>s.status==='draft'&&ROLE&&s.owner===ROLE.email);
const isAiOwner=email=>ROLEMAP[email]==='ai';
const aiDrafts=()=>SCNS.filter(s=>s.status==='draft'&&isAiOwner(s.owner));
const canEditScn=()=>ACTIVE!==OFFICIAL&&myDrafts().some(s=>s.id===ACTIVE); // AI 草稿對人類唯讀
window.setScn=id=>{ACTIVE=id;localStorage.setItem('cr_scn',id);W=DB.allocations.filter(a=>a.layer==='working'&&a.scenario_id===ACTIVE);rebuildPending();applyScnSel();route()};
function rebuildPending(){
  pending={};
  if(ACTIVE!==OFFICIAL)return; // 提案只對正式版（負一#4）
  DB.proposals.filter(x=>x.status==='pending'&&x.target_table==='allocations').forEach(x=>{
    const t=x.target_pk||{};pending[[t.person_id,t.month,t.project_id].join('|')]=x;});
}
function applyScnSel(){
  const el=document.getElementById('scnSel');if(!el)return;
  el.style.display=isAdmin()?'':'none';
  document.getElementById('scnNew').style.display=isAdmin()?'':'none';
  if(!isAdmin())return;
  el.innerHTML=`<option value="${OFFICIAL}">📌 ${(SCNS.find(s=>s.id===OFFICIAL)||{}).name||'正式版'}</option>`
    +myDrafts().map(s=>`<option value="${s.id}">🧪 ${s.name||s.id}</option>`).join('')
    +aiDrafts().filter(s=>!myDrafts().some(x=>x.id===s.id)).map(s=>`<option value="${s.id}">🤖 ${s.name||s.id}</option>`).join('');
  el.value=ACTIVE;
}
const draftBanner=()=>{
  if(!isAdmin()||ACTIVE===OFFICIAL)return '';
  const scn=SCNS.find(s=>s.id===ACTIVE)||{};
  const ai=isAiOwner(scn.owner);
  return `<p class="banner" style="border-color:var(--fP)">${ai?'🤖 AI 提案情境':'🧪 草稿情境'}「<b>${scn.name||ACTIVE}</b>」——${ai?'AI 產生的提案（人類唯讀）：看比較、決定定案或封存。':'只有你看得到；點格＝直接改草稿（不走提案）。'}
    <a href="#compare">與正式版比較</a>
    <button class="miniact ok" onclick="finalizeScn()">定案為正式版</button>
    <button class="miniact" onclick="archiveScn()">封存草稿</button></p>`;
};
// ---- B15: 財報封印 ----
let SEALS=[];
function sealOf(pr,m){return SEALS.find(s=>s.project_id===pr&&s.period_start<=m&&m<=s.period_end)||null}
const sealMark=(pr,m)=>{const s=sealOf(pr,m);return s?'🔒':''};
const sealTip=(pr,m)=>{const s=sealOf(pr,m);return s?`&#10;🔒 已入「${esc(s.report_name)}」（${s.submitted_at} 送出）——此段已定`:''};
function sealConfirm(hits,ctx){ // hits=[{pr,m,seal}]；回傳 Promise<{go,reason}>
  return new Promise(res=>{
    const dlg=document.getElementById('sealDlg');
    document.getElementById('sealMsg').innerHTML=
      `以下 ${hits.length} 格已入送出財報——修改將使系統與已送財報<b>不一致</b>：<br>`+
      hits.slice(0,8).map(h=>`・${SHORT[h.pr]||h.pr} ${ML[h.m]||h.m}：「${esc(h.seal.report_name)}」（${h.seal.submitted_at} 送出）`).join('<br>')+
      (hits.length>8?`<br>…共 ${hits.length} 格`:'');
    document.getElementById('sealReason').value='';document.getElementById('sealYes').value='';
    const done=v=>{dlg.close();res(v)};
    document.getElementById('sealCancel').onclick=()=>done({go:false});
    document.getElementById('sealGo').onclick=()=>{
      const reason=document.getElementById('sealReason').value.trim();
      if(document.getElementById('sealYes').value.trim()!=='YES'||!reason){
        document.getElementById('sealMsg').innerHTML+='<br><b>需輸入 YES 且原因必填。</b>';return}
      done({go:true,reason});
    };
    dlg.showModal();
  });
}
async function sealGate(pairs,what){ // official 寫入前：檢查 (案,月) 是否觸及封印；擋→YES＋原因→audit
  if(ACTIVE!==OFFICIAL)return true; // 草稿沙盒不攔（定案時另計）
  const seen=new Set(),hits=[];
  pairs.forEach(p=>{const key=p.pr+'|'+p.m;if(seen.has(key))return;seen.add(key);
    const s=sealOf(p.pr,p.m);if(s)hits.push({pr:p.pr,m:p.m,seal:s})});
  if(!hits.length)return true;
  const r=await sealConfirm(hits,what);
  if(!r.go)return false;
  try{await dbIns('audit_log',{actor:ROLE.email,table_name:'official',row_pk:hits.map(h=>h.pr+':'+h.m).join(','),
    action:'seal_override',before:null,after:{what,reason:r.reason,cells:hits.length}})}catch(e){}
  return true;
}

async function ensureSnapshot(reason){ // 每個 official 三表寫入路徑進門先過這裡
  if(!isAdmin()||ACTIVE!==OFFICIAL)return; // 草稿寫入不觸發
  const ym=new Date().toISOString().slice(0,7).replace('-','');

  const st=document.getElementById('status');st.innerHTML='<span class="spin"></span> 本月首次修改，先留存快照…';

function scnSealedTouch(){ // 定案 diff 觸及的封印 (案,月)
  const out=new Set();
  const kf=a=>a.person_id+'|'+a.month+'|'+a.project_id;
  const om={},dm={};
  DB.allocations.filter(a=>a.layer==='working'&&a.scenario_id===OFFICIAL).forEach(a=>om[kf(a)]=a);
  W.forEach(a=>dm[kf(a)]=a);
  new Set([...Object.keys(om),...Object.keys(dm)]).forEach(k=>{const o=om[k],d=dm[k];
    if((o?+o.amount_twd:0)!==(d?+d.amount_twd:0)||((o&&+o.loe_pct)||0)!==((d&&+d.loe_pct)||0)){
      const parts=k.split('|');if(sealOf(parts[2],parts[1]))out.add(parts[2]+'|'+parts[1])}});
  const eo={},ed={};
  EXP.forEach(e=>{const k=e.project_id+'|'+e.month;
    if(e.scenario_id===OFFICIAL)eo[k]=(eo[k]||0)+ +e.amount_twd;
    else if(e.scenario_id===ACTIVE)ed[k]=(ed[k]||0)+ +e.amount_twd});
  new Set([...Object.keys(eo),...Object.keys(ed)]).forEach(k=>{
    if((eo[k]||0)!==(ed[k]||0)){const p2=k.split('|');if(sealOf(p2[0],p2[1]))out.add(k)}});
  return [...out];
}

async function dbIns(table,obj,extra){
  const upsert=table.includes('on_conflict')||!!extra; // on_conflict 一律帶 merge，否則同鍵重寫 409
  const r=await authFetch(SB+'/rest/v1/'+table+(extra||''),{method:'POST',
    headers:{'Content-Type':'application/json',Prefer:'return=minimal'+(upsert?',resolution=merge-duplicates':'')},
    body:JSON.stringify(obj)});
  if(!r.ok)throw new Error(table+' 寫入失敗 '+r.status);
}
async function dbUpd(table,filter,obj){
  const r=await authFetch(SB+'/rest/v1/'+table+'?'+filter,{method:'PATCH',
    headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(obj)});
  if(!r.ok)throw new Error(table+' 更新失敗 '+r.status);
}

function openForm(title,fields,onsave){

    if(f.type==='select')return `<div class="row"><span>${f.label}</span><select id="fd_${f.id}" style="width:172px">${f.options.map(o=>`<option value="${o[0]}" ${String(o[0])===String(f.value)?'selected':''}>${o[1]}</option>`).join('')}</select></div>`;

  const sp=[];rows.forEach(r=>{W.filter(a=>a.person_id===pid&&a.month===r.month).forEach(a=>sp.push({pr:a.project_id,m:r.month}))});

function zeroNote(pid,m){ // '—' 格的事件註記
  const evs=(DB.contract_events||[]).filter(e=>e.person_id===pid&&(e.type==='departure'||e.type==='hire'||e.type==='hire_planned'));

// ---- B5: 職務線 ↔ 在座者 對映 ----
function lineAllocs(pr,name){
  // 鐵律：線的身分＝(project_id, line)——先在案內以名對映，同名異案永不合併
  const projAll=W.filter(a=>a.project_id===pr);
  const named=projAll.filter(a=>(a.ned_line||'').replace('*REBUDGET','')===name);
  if(named.length||pr==='ned')return named;
  const lines=DB.budget_lines.filter(b=>b.project_id===pr);
  return lines.length===1?projAll:[]; // 無名列且單線案＝結構唯一歸該線
}
function lineBurn(b){ // {rem,used,pct,over} in TWD
  const proj=prmap[b.project_id]||{};
  const fx=b.currency!=='TWD'?(+proj.fx||RATES[b.currency]||1):1;
  const rem=+b.remaining_orig*fx;
  const used=(+b.july_draw_twd||0)+lineAllocs(b.project_id,b.name).reduce((s,a)=>s+(+a.amount_twd||0),0);
  return{rem,used,pct:rem>0?Math.min(100,used/rem*100):0,over:rem>0&&used>rem+1};
}
function lineSeats(b){ // 目前與未來在座者
  const now=nowMonth();
  const pids=[...new Set(lineAllocs(b.project_id,b.name).filter(a=>a.month>=now&&+a.amount_twd>0).map(a=>a.person_id))];
  return pids;
}
function fundOf(pid,m){ // admin-only: payer composition for one person-month
  const rows=personMonth(pid,m);
  const sal=costOf(pid,m);
  let intAmt=0,grant=0;
  rows.forEach(a=>{const v=+a.amount_twd||0;if(a.project_id==='internal')intAmt+=v;else grant+=v});
  const gap=Math.max(0,sal-(grant+intAmt));      // 薪資>配置合計 → 差額列存金缺口
  const internal=intAmt+gap;
  return {sal,rows,grant,intAmt,gap,internal,active:sal>0||rows.length>0};
}

const AUTH=SB+'/auth/v1';
let SES=null;
function loadSes(){try{SES=JSON.parse(localStorage.getItem('sb_ses'))}catch(e){SES=null}}
function saveSes(s){SES=s;if(s)localStorage.setItem('sb_ses',JSON.stringify(s));else localStorage.removeItem('sb_ses')}
function parseHashTokens(){
  if(!location.hash.includes('access_token='))return null;
  const p=new URLSearchParams(location.hash.slice(1).replace(/^[^#?]*[?]/,''));
  const p2=new URLSearchParams(location.hash.slice(1));
  const g=k=>p2.get(k)||p.get(k);
  const s={access_token:g('access_token'),refresh_token:g('refresh_token'),
    expires_at:Date.now()+((+g('expires_in')||3600)-60)*1000,type:g('type')||''};
  history.replaceState(null,'',location.pathname+'#master');
  return s.access_token?s:null;
}
async function refreshSes(){
  if(!SES||!SES.refresh_token)return false;
  try{
    const r=await fetch(AUTH+'/token?grant_type=refresh_token',{method:'POST',
      headers:{apikey:KEY,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:SES.refresh_token})});
    if(!r.ok){saveSes(null);return false}
    const j=await r.json();
    saveSes({access_token:j.access_token,refresh_token:j.refresh_token,
      expires_at:Date.now()+((j.expires_in||3600)-60)*1000,type:SES.type});
    return true;
  }catch(e){return false}
}
async function authFetch(url,opt){
  opt=opt||{};
  if(SES&&SES.expires_at<Date.now())await refreshSes();
  if(!SES)throw new Error('未登入');
  opt.headers={...(opt.headers||{}),apikey:KEY,Authorization:'Bearer '+SES.access_token};
  let r=await fetch(url,opt);
  if(r.status===401){
    if(await refreshSes()){opt.headers.Authorization='Bearer '+SES.access_token;r=await fetch(url,opt)}
    else{showLogin();throw new Error('登入已過期')}
  }
  return r;
}

  ${yearJump()}

        if(provPerson)provMonth[m]+=f.internal;else intMonth[m]+=f.internal;
        const prov=f.rows.some(a=>a.provisional);
        const tip=f.rows.map(a=>(SHORT[a.project_id]||a.project_id)+' '+k(a.amount_twd)).join('&#10;')
          +(f.gap>0.5?`&#10;⚠ 未覆蓋缺口 ${k(f.gap)}（薪資>配置合計，差額列存金）`:'')
          +(provPerson?'&#10;（暫定人力，列於下方另計列）':'');
        let cls,txt;
        if(f.rows.length===0&&f.sal>0){cls='fN';txt='0'}
        else if(f.internal<=500){cls='fG';txt=Math.round(loeOf(p.id,m).used)}
        else if(f.internal>=f.sal-500||f.grant<=500){cls='fR';txt=k(f.internal)}
        else{cls='fY';txt=k(f.internal)}
        h+=`<td><span class="cell num ${cls} ${(prov||provPerson)?'uP':''} ${m>FARM?'uFar':''}" title="${tip}">${txt}</span></td>`;
        return;
      }
      const{used,cap,rows,active}=loeOf(p.id,m);
      if(!active){h+='<td><span class="cell" style="color:var(--ink3)">—</span></td>';return}
      const prov=rows.some(a=>a.provisional);
      const hasPend=rows.some(a=>pending[[p.id,m,a.project_id].join('|')]);
      const over=used>cap+0.5;
      const cls=over?'uOver':used>=cap-1?'u100':used>=cap*0.6?'u60':'u0';
      const nt=noteOf('person',p.id,m);
      h+=`<td><span class="cell num ${cls} ${prov?'uP':''} ${hasPend?'pend':''} ${m>FARM?'uFar':''} ${nt?'hasNote':''}" title="${over?'⚠ 超過容量上限 '+cap+'%&#10;':''}${rows.map(a=>(SHORT[a.project_id]||a.project_id)+' '+k(a.amount_twd)).join('&#10;')}${nt?'&#10;📝 '+esc(nt):''}${rows.filter(a=>sealOf(a.project_id,m)).map(a=>sealTip(a.project_id,m)).join('')}">${Math.round(used)}${hasPend?'⏳':''}${rows.some(a=>sealOf(a.project_id,m))?'🔒':''}</span></td>`;
    });
    h+='</tr>';
  });
  if(fund){
    h+=`<tr class="introw"><td><b>薪資·存金投入（實）</b></td>${M.map(m=>`<td><span class="cell num">${intMonth[m]>500?k(intMonth[m]):'0'}</span></td>`).join('')}</tr>`;
    if(M.some(m=>provMonth[m]>500))
      h+=`<tr class="introw" style="opacity:.75"><td><b style="font-weight:600">暫定人力·存金投入（另計）</b></td>${M.map(m=>`<td><span class="cell num uP">${provMonth[m]>500?k(provMonth[m]):'0'}</span></td>`).join('')}</tr>`;
    const eB={},eN={};M.forEach(m=>{const e=expInt(ACTIVE,m);eB[m]=e.ben;eN[m]=e.np});
    if(M.some(m=>eB[m]>500))
      h+=`<tr class="introw"><td><b style="font-weight:600">福利·存金投入（模型派生）</b></td>${M.map(m=>`<td><span class="cell num">${eB[m]>500?k(eB[m]):'0'}</span></td>`).join('')}</tr>`;
    if(M.some(m=>eN[m]>500))
      h+=`<tr class="introw"><td><b style="font-weight:600">非人事·存金投入（支出計劃）</b></td>${M.map(m=>`<td><span class="cell num">${eN[m]>500?k(eN[m]):'0'}</span></td>`).join('')}</tr>`;
    const tot={};let grand=0;M.forEach(m=>{tot[m]=intMonth[m]+eB[m]+eN[m];grand+=tot[m]});
    h+=`<tr class="introw" style="border-top:2px solid var(--crit)"><td><b>月合計（帳面）</b></td>${M.map(m=>`<td><span class="cell num" style="font-weight:700">${tot[m]>500?k(tot[m]):'0'}</span></td>`).join('')}</tr>`;
    var fundGrand=grand; // 供下方對帳註記
  }
  h+='</tbody></table></div>';
  h+=fund
    ?`<p class="note">資金視圖（資金水位）：格色＝payer 組成；🟡/🔴 格內數字＝該月存金額；⬜粗紅框＝有薪資但無任何配置。遮蔽開啟時金額顯示 ●●● 但顏色保留。${(()=>{const hd=(SCNS.find(s=>s.id===ACTIVE)||{}).headline;if(!(hd&&+hd.aug_jan_internal))return '';
      const AJ=M.filter(m=>m>='202608'&&m<='202701');
      const chain=Math.round(AJ.reduce((s,m)=>s+intMonth[m]+provMonth[m]+expInt(ACTIVE,m).ben+expInt(ACTIVE,m).np,0));
      const kpi=+hd.aug_jan_internal;const ok=Math.abs(chain-kpi)<1000;
      return `<br>🔗 <b>對帳鏈（Aug–1月）</b>：薪資實 ＋ 暫定另計 ＋ 福利 ＋ 非人事 ＝ ${money(chain.toLocaleString('zh-TW'))} ↔ KPI 帳面 ${money(kpi.toLocaleString('zh-TW'))} ${ok?'✅ 吻合（差 '+money(String(chain-kpi))+' 元＝進位）':'⚠ 不吻合，差 '+money(String(chain-kpi))+' 元'}`})()}</p>`
    :'<p class="note">格內＝已配置 LOE%；紅＝有剩餘容量；虛線框＝暫定；⏳＝有待套用提案。點列→個人頁。</p>';
  h+=farNote();
  return h;
}

function mySummary(pid){
  const p=pmap[pid];
  const lbl=m=>(+m.slice(0,4))+'/'+(+m.slice(4));
  const sig=m=>personMonth(pid,m).map(a=>a.project_id+':'+Math.round(a.loe_pct!=null?+a.loe_pct:0)).sort().join(',');
  // 連續相同組成的月份合併成段；只描述有配置的月份（D5）
  const runs=[];let cur=null;
  M.forEach(m=>{const s=sig(m);
    if(!cur||cur.s!==s){cur={s,start:m,end:m};runs.push(cur)}else cur.end=m});
  const parts=runs.filter(r=>r.s!=='').map(r=>{
    const mix=personMonth(pid,r.start).sort((a,b)=>(+b.loe_pct||0)-(+a.loe_pct||0)).map(a=>
      `<b style="color:var(${PC[a.project_id]||'--ink'})">${SHORT[a.project_id]||(prmap[a.project_id]&&prmap[a.project_id].name)||a.project_id} ${Math.round(a.loe_pct!=null?+a.loe_pct:0)}%</b>${prmap[a.project_id]&&prmap[a.project_id].provisional?'<span class="prov-badge">暫定</span>':''}`).join('＋');
    return `<b>${lbl(r.start)}${r.end!==r.start?'–'+lbl(r.end):''}</b>：${mix}`;
  });
  const emptyTail=runs.length&&runs[runs.length-1].s===''?runs[runs.length-1]:null;
  const tail=emptyTail?`；<b>${lbl(emptyTail.start)} 起</b>：無配置${zeroNote(pid,emptyTail.start)?`（${zeroNote(pid,emptyTail.start)}）`:''}`:'';
  let extra='';
  if(W.some(a=>a.person_id===pid&&a.project_id==='se'&&a.month==='202612'))
    extra='<br><span style="color:var(--ink2)">12月：AIT(SE) 於 12/14 結案，該月按 12/1–14 與 12/15–31 分段計。</span>';
  const pends=Object.values(pending).filter(x=>(x.target_pk||{}).person_id===pid).length;
  return `<div class="mysum">📋 <b>${p.alias||p.name}</b> 的配置摘要——${parts.join('；')||'（目前無配置）'}${tail}。
    每月所有專案加總不超過你的容量上限（現行 ${capOf(pid,M[0])}%）。虛線＝尚待簽約/核准的暫定安排。${extra}
    ${pends?`<br><span style="color:var(--warn)">⏳ 你有 ${pends} 筆修改提案等待財務/CEO 套用。</span>`:''}
  </div>`;
}

  DB.projects.forEach(p=>{
    const mm=String(p.period||'').match(/\[(\d{4})-(\d{2})[^,]*,(\d{4})-(\d{2})-(\d{2})/);
    let per='—';
    if(mm){let em=mm[3]+mm[4];if(String(p.period).trim().endsWith(')')&&mm[5]==='01')em=mAdd(em,-1);
      per=`${+mm[1]}/${+mm[2]}–${+em.slice(0,4)}/${+em.slice(4)}`}
    const lines=DB.budget_lines.filter(b=>b.project_id===p.id);
    let budget=0,used=0;
    lines.forEach(b=>{const x=lineBurn(b);budget+=x.rem;used+=x.used});
    const projW=W.filter(a=>a.project_id===p.id);
    if(!lines.length)used=projW.reduce((s,a)=>s+(+a.amount_twd||0),0);
    const lastM=projW.reduce((mx,a)=>a.month>mx?a.month:mx,'');
    const ppl=new Set(projW.map(a=>a.person_id)).size;
    const pct=budget>0?Math.min(100,used/budget*100):0;
    h+=`<tr class="click" onclick="location.hash='#project/${p.id}'">
      <td><b>${p.name}</b>${p.provisional?`<span class="prov-badge">pipeline${p.confidence!=null?' '+Math.round(p.confidence*100)+'%':''}</span>`:''}</td>

      <td class="num">${budget?k(budget):'—'}</td><td class="num">${used?k(used):'—'}</td>
      <td>${budget?`<div class="bar"><i class="${used>budget?'over':''}" style="width:${pct}%"></i></div>`:'—'}</td>
      <td class="num">${lastM?(+lastM.slice(0,4))+'/'+(+lastM.slice(4)):'—'}</td><td class="num">${ppl||'—'}</td></tr>`;

window.frmSeat=(pr,name)=>{
  const now=nowMonth();
  const defFrom=M.includes(now)?now:M[0];
  openForm('安排接替／加入：'+(SHORT[pr]||(prmap[pr]||{}).name||pr)+'｜'+name,[
    {id:'pid',label:'人員',type:'select',value:'',options:[['','（選擇人員）'],...DB.people.filter(p=>p.id!=='tara').map(p=>[p.id,(p.alias||p.name)+(p.provisional?'（暫定）':'')])]},
    {id:'from',label:'起月',type:'select',value:defFrom,options:M.map(x=>[x,ML[x]])},
    {id:'to',label:'迄月',type:'select',value:defFrom,options:M.map(x=>[x,ML[x]])},
    {id:'loe',label:'LOE %',type:'number',value:50},
  ],async v=>{
    const b=DB.budget_lines.find(x=>x.project_id===pr&&x.name===name);
    const l=+v.loe;if(!(l>0&&l<=100))throw new Error('LOE 需在 1–100');
    if(v.to<v.from)throw new Error('迄月不可早於起月');
    const months=M.filter(m=>m>=v.from&&m<=v.to);
    const p=pmap[v.pid];if(!p)throw new Error('請選人員');
    let add=0;
    for(const m of months){
      const sal=costOf(v.pid,m);
      if(!sal)throw new Error(ML[m]+'：'+(p.alias||p.name)+' 無在職成本（未到職／已離職／資料未排）');
      const{used,cap}=loeOf(v.pid,m);
      if(used+l>cap+0.5)throw new Error(ML[m]+' 合計將達 '+Math.round(used+l)+'%，超過容量 '+cap+'%');
      add+=Math.round(sal/capOf(v.pid,m)*l);
    }
    const{rem,used:lu}=lineBurn(b);
    if(rem>0&&lu+add>rem+1)throw new Error('累計爆線：已排 '+Math.round(lu/1000)+'k＋新增 '+Math.round(add/1000)+'k > 線剩餘 '+Math.round(rem/1000)+'k');
    if(isAdmin()&&ACTIVE!==OFFICIAL){ // 草稿：直接生效
      if(!canEditScn())throw new Error('這是 AI（或他人）的草稿，對你唯讀');
      for(const m of months){
        const amt=Math.round(costOf(v.pid,m)/capOf(v.pid,m)*l);
        const exist=W.find(a=>a.person_id===v.pid&&a.month===m&&a.project_id===pr);
        if(exist)await dbUpd('allocations','id=eq.'+exist.id,{loe_pct:l,amount_twd:amt,ned_line:name});
        else await dbIns('allocations',{person_id:v.pid,month:m,project_id:pr,loe_pct:l,amount_twd:amt,
          layer:'working',scenario_id:ACTIVE,provisional:(prmap[pr]||{}).provisional||false,ned_line:name});
      }
      await reload('草稿已排入 '+months.length+' 個月');return;
    }
    for(const m of months){
      const amt=Math.round(costOf(v.pid,m)/capOf(v.pid,m)*l);
      await dbIns('edit_proposals',{author:localStorage.getItem('cr_author')||'admin',target_table:'allocations',action:'update',
        target_pk:{person_id:v.pid,month:m,project_id:pr},
        payload:{loe_pct:l,amount_twd:amt,ned_line:name},
        note:'職務頁安排：'+name+'（'+ML[v.from]+'–'+ML[v.to]+'）'});
    }
    await reload('已送出 '+months.length+' 筆接替提案（修約頁套用後生效）');
  });
};

function scnMetrics(arr,scnId){
  const sv=W,sc=CTXSCN;W=arr;CTXSCN=scnId||null; // 用該情境的用人表算
  let internal=0,over=0,total=0;
  DB.people.forEach(p=>{const provP=p.provisional&&p.id!=='newfo';
    M.forEach(m=>{
      const f=fundOf(p.id,m);if(f.active&&!provP)internal+=f.internal;
      const{used,cap,active}=loeOf(p.id,m);if(active&&used>cap+0.5)over++;
    })});
  arr.forEach(a=>total+=+a.amount_twd||0);
  W=sv;CTXSCN=sc;return{internal,over,total};
}
function staffDiff(offScn,drScn){ // B10: 用人差異（薪資/容量/起訖）
  const out=[];
  DB.people.forEach(p=>{
    const g=s=>M.map(m=>STAFF[s+'|'+p.id+'|'+m]||null);
    const o=g(offScn),d=g(drScn);
    const span=arr=>{const act=M.filter((m,i)=>arr[i]&&+arr[i].cost>0);return act.length?[act[0],act[act.length-1]]:null};
    const so=span(o),sd=span(d);
    const costD=M.filter((m,i)=>((o[i]?+o[i].cost:0)!==(d[i]?+d[i].cost:0)));
    const capD=M.filter((m,i)=>{const a=o[i]&&+o[i].cost>0?+o[i].capacity:null,b=d[i]&&+d[i].cost>0?+d[i].capacity:null;
      return a!=null&&b!=null&&a!==b});
    if(!costD.length&&!capD.length)return;
    const fmtSpan=s=>s?`${+s[0].slice(0,4)}/${+s[0].slice(4)}–${+s[1].slice(0,4)}/${+s[1].slice(4)}`:'不在編';
    const parts=[];
    if(JSON.stringify(so)!==JSON.stringify(sd))parts.push(`在職期間 ${fmtSpan(so)} → <b>${fmtSpan(sd)}</b>`);
    const salM=costD.filter((m)=>{const i=M.indexOf(m);return o[i]&&d[i]&&+o[i].cost>0&&+d[i].cost>0});
    if(salM.length){const i=M.indexOf(salM[0]);
      parts.push(`薪資 ${salM.length} 個月不同（首例 ${ML[salM[0]]}：${k(+o[i].cost)}→<b>${k(+d[i].cost)}</b>）`)}
    if(capD.length){const i=M.indexOf(capD[0]);
      parts.push(`容量 ${capD.length} 個月不同（首例 ${ML[capD[0]]}：${+o[i].capacity}%→<b>${+d[i].capacity}%</b>）`)}
    if(parts.length)out.push({pid:p.id,name:p.alias||p.name,desc:parts.join('；')});
  });
  return out;
}
function vCompare(cmpId){

  const baseId=cmpId?cmpId:OFFICIAL, targetId=cmpId?OFFICIAL:ACTIVE;

  const dN=v=>v>0?`<span style="color:var(--crit)">▲${v}</span>`:v<0?`<span style="color:var(--good)">▼${-v}</span>`:'—';
  const ai=isAiOwner(scn.owner);
  const hl=s=>{const hd=(s||{}).headline;if(!hd)return '（無帳面標題）';
    if(+hd.fy2026_loss_best)return (hd.label||'')+' '+wan(+hd.fy2026_loss_best)+'–'+wan(+hd.fy2026_loss_worst||+hd.fy2026_loss_best);

  const baseTag=cmpId?`${isSnap(hist)?'📸':'🗄'} ${offName}`:`📌 ${offName}`;
  const targetTag=cmpId?`📌 現行正式版`:`${ai?'🤖':'🧪'} ${scn.name||ACTIVE}`;
  const baseHead=cmpId?'歷史版':'正式版', targetHead=cmpId?'現行':'草稿';
  let h=`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
    <b>${cmpId?'歷史比較（改了什麼）：':'情境比較：'}</b><span class="pill">${baseTag}</span> vs <span class="pill" style="border-style:dashed">${targetTag}</span>

    <a class="hbtn" href="${cmpId?'#scenarios':'#master'}" style="text-decoration:none">${cmpId?'回提案總覽':'回總表'}</a></div>
  <p class="note" style="margin:0 0 10px">帳面口徑：${baseTag.slice(0,2)} ${hl(cmpId?hist:SCNS.find(s=>s.id===OFFICIAL))}　｜　${targetTag.slice(0,2)} ${hl(scn)}</p>
  ${!cmpId&&scn.rationale?`<div class="mysum" style="border-left-color:var(--fP)">${ai?'🤖 <b>AI 提案理由</b>：':'📝 <b>情境說明</b>：'}${scn.rationale}</div>`:''}
  ${cmpId?`<div class="mysum" style="border-left-color:var(--fP)">📸 ${esc(hist.note||'')}（留存於 ${hist.date||''}）——下表差異＝從這份歷史狀態到現在的所有變動。</div>`:''}`;
  h+=`<div class="tblwrap"><table><thead><tr><th>指標</th><th>${baseHead}</th><th>${targetHead}</th><th>差異</th></tr></thead><tbody>
    <tr><td>存金合計（薪資實，全時間軸）</td><td class="num">${k(mo.internal)||'0'}</td><td class="num">${k(md.internal)||'0'}</td><td class="num">${dTag(md.internal-mo.internal)}</td></tr>
    ${(()=>{const eo=M.reduce((s,m)=>{const e=expInt(baseId,m);return s+e.ben+e.np},0);
      const ed=M.reduce((s,m)=>{const e=expInt(targetId,m);return s+e.ben+e.np},0);

    <tr><td>超容量格數</td><td class="num">${mo.over}</td><td class="num">${md.over}</td><td class="num">${dN(md.over-mo.over)}</td></tr>

  const sd=staffDiff(baseId,targetId);

  const keys=[...new Set([...Object.keys(om),...Object.keys(dm)])].sort();

    const lo=o&&o.loe_pct!=null?Math.round(+o.loe_pct):0,ld=d&&d.loe_pct!=null?Math.round(+d.loe_pct):0;
    const ao=o?+o.amount_twd||0:0,ad=d?+d.amount_twd||0:0;

        <td class="num">${x.lo}%→<b>${x.ld}%</b> ${x.ld>x.lo?'▲':'▼'}</td>

    });
    h+='</tbody></table></div>';
  }
  h+='<p class="note">點任一筆跳到該人個人頁對照。定案＝整份取代正式版（舊版歸檔可回看）；不做即時合併——想法不同就各開一份草稿來比。</p>';
  return h;
}

  if(l<0||total>edCtx.cap+0.5){updAmt();return}
  if(isAdmin()&&ACTIVE!==OFFICIAL){ // 草稿：直接寫入，不走提案
    if(!canEditScn()){edError('這是 AI（或他人）的草稿，對你唯讀——請用「與正式版比較」後決定定案或封存。');return}
    const t=edCtx;const amt=Math.round(t.sal/t.cap*l);
    const exist=W.find(a=>a.person_id===t.pid&&a.month===t.m&&a.project_id===t.pr);
    try{
      if(exist)await dbUpd('allocations','id=eq.'+exist.id,{loe_pct:l,amount_twd:amt});
      else await dbIns('allocations',{person_id:t.pid,month:t.m,project_id:t.pr,loe_pct:l,amount_twd:amt,
        layer:'working',scenario_id:ACTIVE,provisional:(prmap[t.pr]||{}).provisional||false});
    }catch(e){edError('草稿寫入失敗：'+e.message);return}
    document.getElementById('editDlg').close();
    await reload('草稿已更新');return;
  }
  const author=document.getElementById('edAuthor').value.trim();
  if(!author){edError('請填提案人名字');return}
  localStorage.setItem('cr_author',author);
  const body={author,target_table:'allocations',action:'update',
    target_pk:{person_id:edCtx.pid,month:edCtx.m,project_id:edCtx.pr},
    payload:isAdmin()?{loe_pct:l,amount_twd:Math.round(edCtx.sal/edCtx.cap*l)}:{loe_pct:l},
    note:document.getElementById('edNote').value.trim()||null};
  let r;
  try{r=await authFetch(SB+'/rest/v1/edit_proposals',{method:'POST',
    headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)});}
  catch(e){edError('送出失敗：'+e.message);return}
  if(!r.ok){edError('送出失敗（'+r.status+'），請稍後再試');return}
  document.getElementById('editDlg').close();
  await reload('提案已送出');
};

// ---- shell ----
function route(){
  if(!DB)return;
  const parts=(location.hash||'#master').slice(1).split('/');
  let page=parts[0],arg=parts.slice(1).join('/');
  if(!isAdmin()){
    if(['lines','line','amend','compare','scenarios'].includes(page)){
      document.getElementById('title').textContent='僅限管理者';
      document.getElementById('app').innerHTML='<p class="banner err">此頁僅管理者可見。</p>';
      return;
    }
    if(page==='person'&&ROLE.person_id&&arg&&arg!==ROLE.person_id){arg=ROLE.person_id;history.replaceState(null,'','#person/'+arg)}
    if(page==='person'&&!arg&&ROLE.person_id)arg=ROLE.person_id;
  }
  const navPg=page==='project'?'projects':page==='line'?'lines':page;
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.hash.split('/')[0]==='#'+navPg));
  const T={master:'總表',person:isAdmin()?'個人頁':'我的頁面',project:'專案頁',projects:'專案總覽',lines:'職務總覽',line:'職務頁',amend:'修約與閘門',compare:'情境比較',scenarios:'提案總覽'};
  document.getElementById('title').textContent=T[page]||'總表';
  document.getElementById('app').innerHTML=(page==='compare'?'':draftBanner())+
    (page==='person'?vPerson(arg):page==='project'?vProject(arg):page==='projects'?vProjects()
     :page==='lines'?vLines():page==='line'?vLine(arg):page==='amend'?vAmend():page==='compare'?vCompare(arg)
     :page==='scenarios'?vScenarios():vMaster());
}
async function reload(msg){
  const st=document.getElementById('status');
  st.innerHTML='<span class="spin"></span>';
  try{await loadAll();route();st.textContent=(msg||'已同步')+' '+new Date().toLocaleTimeString('zh-TW',{hour12:false});}
  catch(e){st.textContent='';document.getElementById('app').innerHTML=`<p class="banner err">資料載入失敗：${e.message}。<button class="hbtn" onclick="reload()">重試</button></p>`}
}
document.getElementById('refresh').onclick=()=>reload();
document.getElementById('maskBtn').onclick=()=>{
  MASK=!MASK;localStorage.setItem('cr_mask',MASK?'1':'0');
  document.getElementById('maskBtn').textContent=MASK?'🙈 金額':'👁 金額';
  route();
};
if(MASK)document.getElementById('maskBtn').textContent='🙈 金額';
document.getElementById('theme').onclick=()=>{
  const cur=document.documentElement.dataset.theme||'auto';
  const next=cur==='auto'?'dark':cur==='dark'?'light':'auto';
  if(next==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=next;
  localStorage.setItem('cr_theme',next);
};
const th=localStorage.getItem('cr_theme');if(th&&th!=='auto')document.documentElement.dataset.theme=th;
addEventListener('hashchange',route);
// ---------- boot ----------
loadSes();
const fresh=parseHashTokens();
if(fresh){
  saveSes(fresh);
  if(fresh.type==='invite'||fresh.type==='recovery'||fresh.type==='signup'){
    document.getElementById('login').style.display='block';
    document.getElementById('lgEmail').style.display='none';
    document.getElementById('lgSend').style.display='none';
    document.querySelector('#login p').textContent='歡迎加入！你已透過邀請連結登入。';
    document.getElementById('pwdBox').style.display='block';
  }else enterApp();
}else if(SES&&SES.access_token){enterApp()}
else showLogin();
</script>
